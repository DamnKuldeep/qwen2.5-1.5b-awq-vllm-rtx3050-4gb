# The whole stack, one command - Stage 7.
#
#   cd deployment/docker
#   docker compose up --build
#
# Brings up vLLM and the gateway. Prometheus and Grafana are defined here but
# sit behind a profile and do not start until Stage 8 creates their config:
#
#   docker compose --profile observability up -d
#
# Reachable at:
#   http://localhost:8000       vLLM directly (and /metrics for Stage 8)
#   http://localhost:8080/chat  chat UI
#   http://localhost:8080/dashboard  product usage dashboard
#   http://localhost:3000       Grafana (Stage 8)

name: inference-product

services:

  # ---------------------------------------------------------------------
  # The inference engine. Flags are the Stage 1 set, unchanged - they were
  # derived from this machine's 4 GiB budget and are explained in DECISIONS.md.
  # Keep in sync with deployment/docker/run_vllm.ps1.
  # ---------------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:v0.11.0
    container_name: vllm
    restart: unless-stopped

    # Docker's default /dev/shm is 64 MB. PyTorch uses shared memory for
    # inter-process tensor passing and dies with cryptic bus errors when it
    # runs out. Equivalent to --ipc=host on docker run.
    ipc: host

    ports:
      - "8000:8000"

    volumes:
      - hf-cache:/root/.cache/huggingface
      # Separate volume for the torch.compile cache, which lives at
      # /root/.cache/vllm - OUTSIDE the huggingface cache. Stage 1's notes
      # wrongly assumed hf-cache covered it; it did not, so every `docker run
      # --rm` launch paid the full ~60 s compile. Mounting it makes restarts
      # genuinely fast, which matters for Stage 10 (killing and restarting
      # vLLM mid-load-test) and Stage 11 (many launches, one per variant).
      - vllm-cache:/root/.cache/vllm

    command:
      - --model=Qwen/Qwen2.5-3B-Instruct-AWQ
      - --revision=3559b226e8ce77211e2c1bd7ddfb7686fec4d6dd
      - --tokenizer-revision=3559b226e8ce77211e2c1bd7ddfb7686fec4d6dd
      - --quantization=awq_marlin
      - --dtype=float16
      # Parameterised for Stage 11 Experiment 3b. The shipping value is 4096
      # (Stage 1). Lowered to 2048 only for the head-to-head against the
      # unquantized 1.5B, which cannot start at 4096 - both arms must use the
      # same value for the comparison to mean anything.
      #
      #   $env:VLLM_MAX_MODEL_LEN=2048
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-4096}
      # Parameterised for Stage 11 Experiment 1. Default 8 is the Stage 1 value,
      # sized against a 4,096-token worst case. Stage 9 and the Stage 11
      # baseline both found it to be the binding constraint on throughput, with
      # KV cache idle at 13-20% and preemptions at zero.
      #
      #   $env:VLLM_MAX_NUM_SEQS=24
      #   docker compose up -d --force-recreate vllm
      #
      # Kept as a variable rather than an edit so the before/after pair is
      # reproducible from the command line rather than from memory.
      - --max-num-seqs=${VLLM_MAX_NUM_SEQS:-8}
      # Parameterised for the finalization throughput sweep. 2048 was chosen in
      # Stage 1 because activation memory scales with this value and every MiB
      # saved became KV cache on a 4 GiB card carrying 1.95 GiB of weights.
      # The 1.5B model carries only 1.10 GiB, so that constraint is much looser
      # and raising this is a real lever on prefill (and therefore TTFT, which
      # Stage 9 identified as the binding term).
      - --max-num-batched-tokens=${VLLM_MAX_NUM_BATCHED_TOKENS:-2048}
      - --gpu-memory-utilization=0.78
      - --enable-prefix-caching
      - --swap-space=2
      - --host=0.0.0.0
      - --port=8000

    # The Compose equivalent of `--gpus all`.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # python3, NOT python. This image is Ubuntu-based and has no `python`
    # alias - visible in the container's own command, `python3 -m vllm...`.
    # The first version of this healthcheck used `python` and failed silently
    # every 15 s with "not found", so the container sat at health: starting
    # forever and the gateway, which waits on service_healthy, never started.
    #
    # The general trap: a healthcheck that cannot run is indistinguishable from
    # a service that is not ready, and during start_period it produces no
    # visible error at all. Diagnose with:
    #   docker inspect --format="{{json .State.Health}}" vllm
    #
    # start_period is generous because a cold start is genuinely slow: weight
    # loading plus ~30-60 s of torch.compile when the compile cache is cold.
    # During start_period, failures do not count against retries.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 420s

  # ---------------------------------------------------------------------
  # The product: auth, budgets, dashboard, chat UI.
  # ---------------------------------------------------------------------
  gateway:
    build:
      # Context is the project root because the image needs gateway/ AND ui/.
      context: ../..
      dockerfile: gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      # NOT localhost. Inside this container, localhost is the gateway itself.
      # On a Compose network, service names are DNS names - which is exactly
      # why this was an environment variable from Stage 3 rather than a
      # hardcoded constant.
      VLLM_BASE_URL: http://vllm:8000
      GATEWAY_DB_PATH: /data/usage.db

      # ---- Admission control (v2) --------------------------------------
      # Every value here is a measurement, not a preference. See
      # gateway/admission.py and docs/CAPACITY_MODEL.md for the derivations.

      # Concurrent requests forwarded to the engine. Measured on the chat
      # workload with retrying clients: 6 -> 10 took 20-user SLO attainment
      # from 85-92% to 99% with no rise in admitted TTFT, because prefix-cache
      # hits make each chat request far cheaper than the cold prompts the
      # original ceiling of 6 was measured with. See gateway/admission.py.
      GATEWAY_MAX_INFLIGHT: ${GATEWAY_MAX_INFLIGHT:-10}

      # Waiting slots. Shallow on purpose: the queue absorbs arrival jitter,
      # it is not a backlog store.
      GATEWAY_MAX_QUEUE: ${GATEWAY_MAX_QUEUE:-12}

      # How long a request may wait for a slot before a 503. Bounds admitted
      # TTFT (worst case ~ this + engine TTFT). 0.6 s was derived treating a
      # refusal as free; clients retry after 2 s, so it is not. Measured: 1.0 s
      # beat 0.6 s at 40 users (51% vs 35% SLO attainment), and 2.0 s pushed
      # admitted p95 past the SLO.
      GATEWAY_QUEUE_TIMEOUT_S: ${GATEWAY_QUEUE_TIMEOUT_S:-1.0}

      # Upper bound on one key's share - half the pool. The live share is
      # ceil(limit / contending keys), so one abusive client cannot starve the
      # rest. Worst case #2 tests this directly.
      GATEWAY_MAX_INFLIGHT_PER_KEY: ${GATEWAY_MAX_INFLIGHT_PER_KEY:-5}

      # A stream outliving this is abandoned and its slot released, so a client
      # reading one byte per second cannot hold capacity indefinitely.
      GATEWAY_STREAM_TIMEOUT_S: ${GATEWAY_STREAM_TIMEOUT_S:-300}

      # Output bound. vLLM defaults an ABSENT max_tokens to the rest of the
      # context window - ~30,000 tokens on a 32k window - so a client that
      # forgets the field can hold an admission slot for minutes. The gateway
      # injects the default when the field is missing and clamps anything
      # above the ceiling (reported in X-Max-Tokens-Clamped-From). At ~14 ms
      # per token at six concurrent, 2,048 tokens is a ~30 s worst-case hold.
      GATEWAY_DEFAULT_MAX_TOKENS: ${GATEWAY_DEFAULT_MAX_TOKENS:-1024}
      GATEWAY_MAX_OUTPUT_TOKENS: ${GATEWAY_MAX_OUTPUT_TOKENS:-2048}

      # Request body ceiling (413 above it, before parsing). A full 32k-token
      # window is well under 1 MB of text; this only stops absurd bodies from
      # costing memory and engine tokenizer CPU on their way to a refusal.
      GATEWAY_MAX_REQUEST_BYTES: ${GATEWAY_MAX_REQUEST_BYTES:-4194304}

    volumes:
      # Usage and budgets survive `docker compose down` and rebuilds. Without
      # this the database would live in the container's writable layer and
      # every rebuild would silently reset every budget.
      - gateway-data:/data

    depends_on:
      vllm:
        # NOT just `depends_on: [vllm]`. That waits only for the container to
        # start, and vLLM then spends 2-3 minutes loading weights and compiling.
        # The gateway would come up, fail its first health check against a
        # not-yet-listening engine, and report the stack unhealthy while nothing
        # is actually wrong. service_healthy waits for the engine to answer.
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Observability - defined now, activated in Stage 8.
  #
  # Behind a profile so `docker compose up` does not try to start services
  # whose config files do not exist yet. Stage 8 writes the config and then
  # starts them with:  docker compose --profile observability up -d
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

  grafana:
    image: grafana/grafana:11.5.1
    container_name: grafana
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../../observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Anonymous admin access. Acceptable because this binds to localhost and
      # PRODUCT_SPEC scopes out authentication; it would need a real login
      # before facing a network.
      # Server-side PNG rendering, used to capture the dashboard images in
      # docs/img/. Harmless when the renderer is not running - Grafana simply
      # returns its "renderer unavailable" placeholder and nothing else breaks.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------
  # Grafana's headless-Chromium PNG renderer.
  #
  # BEHIND ITS OWN PROFILE ON PURPOSE. It is ~400 MB and exists only to
  # capture the dashboard screenshots committed under docs/img/. Nobody
  # running this stack to serve traffic should have to download it:
  #
  #   docker compose --profile observability --profile capture up -d
  #
  # Without it Grafana works normally in a browser; only /render returns a
  # placeholder image.
  # ---------------------------------------------------------------------
  renderer:
    image: grafana/grafana-image-renderer:3.11.6
    container_name: grafana-renderer
    profiles: [capture]
    restart: unless-stopped
    environment:
      ENABLE_METRICS: "false"
      # Headless Chromium otherwise reports Etc/Unknown, which Grafana's
      # moment-timezone has no data for - it throws and every render comes
      # back as the "renderer unavailable" placeholder.
      TZ: UTC
      BROWSER_TZ: UTC

volumes:
  # EXTERNAL, and this matters. Compose normally prefixes volume names with the
  # project name, so a plain `hf-cache:` here would create
  # `inference-product_hf-cache` - a different, EMPTY volume - and vLLM would
  # re-download the 2.7 GB model. `external: true` points at the existing
  # top-level volume created by run_vllm.ps1.
  #
  # If it does not exist yet:  docker volume create hf-cache
  hf-cache:
    external: true

  vllm-cache:
  gateway-data:
  prometheus-data:
  grafana-data:
