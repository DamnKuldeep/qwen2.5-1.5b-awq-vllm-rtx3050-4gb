[pytest]
testpaths = gateway/tests

# Put the project root on sys.path so tests can `from gateway import main`.
# Without this, pytest adds only the test directory, and the import fails.
pythonpath = .

markers =
    integration: requires the full running stack (vLLM + gateway + seeded DB)

# Integration tests are excluded by default so `pytest` is fast and needs no
# GPU. The contract tests run against a stub upstream in milliseconds, which is
# the point: a test that only runs when the whole stack happens to be up is a
# test that stops being run.
#
# Run the integration tests explicitly with:  pytest -m integration
addopts = -m "not integration" --strict-markers -q
