<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/></marker></defs><rect width="900" height="480" fill="#0d1117"/><text x="28" y="34" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="650" text-anchor="start">One GPU, one engine, one gateway that decides what reaches it</text><text x="28" y="55" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Every request crosses the gateway; the engine never sees load it cannot serve.</text><rect x="28" y="84" width="140" height="234" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="44" y="110" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" text-anchor="start">Clients</text><text x="44" y="134" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start">Chat UI</text><text x="44" y="149" fill="#6e7681" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">/chat, streaming</text><text x="44" y="178" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start">OpenAI SDK</text><text x="44" y="193" fill="#6e7681" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">any client, base_url</text><text x="44" y="222" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start">chat_sim.py</text><text x="44" y="237" fill="#6e7681" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">retrying load</text><text x="44" y="266" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start">failure tests</text><text x="44" y="281" fill="#6e7681" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">14 injected cases</text><rect x="200" y="84" width="300" height="234" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="216" y="110" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" text-anchor="start">Gateway</text><text x="484" y="110" fill="#6e7681" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="end">FastAPI :8080</text><rect x="214" y="128" width="272" height="40" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/><rect x="214" y="128" width="3" height="40" rx="1.5" fill="#d29922"/><text x="226" y="145" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="620" text-anchor="start">Auth and budgets</text><text x="226" y="160" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">API keys · token budgets · 429</text><rect x="214" y="175" width="272" height="40" rx="6" fi