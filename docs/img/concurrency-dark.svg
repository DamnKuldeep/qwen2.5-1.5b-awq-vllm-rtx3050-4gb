<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/></marker></defs><rect width="900" height="330" fill="#0d1117"/><text x="28" y="34" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="650" text-anchor="start">Three numbers are called "concurrency". Only one is a limit.</text><text x="28" y="55" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Confusing them is the fastest way to a wrong capacity model.</text><rect x="28" y="84" width="272" height="216" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="28" y="84" width="4" height="216" rx="2" fill="#3fb950"/><text x="50" y="128" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="34" font-weight="700" text-anchor="start">6</text><text x="50" y="150" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start">requests on the GPU at once</text><text x="50" y="178" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">THE limit. Set by the gateway.</text><text x="50" y="195" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">Measured: p95 TTFT holds at 6,</text><text x="50" y="212" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">fails by 36% at 12.</text><text x="50" y="246" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">Cap fixed; what fits is dynamic —</text><text x="50" y="263" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">a 20k prompt costs 4 of the 6.</text><rect x="320" y="84" width="272" height="216" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="320" y="84" width="4" height="216" rx="2" fill="#4493f8"/><text x="342" y="128" fill="#4493f8" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="34" font-weight="700" text-anchor="start">32</text><text x="342" y="150" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start">--max-num-seqs</text><text x="342" y="178" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">The engine's own batch ceiling.</text><text x="342" y="195" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">Deliberately above 6 so it can</text><text x="342" y="212" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">never be the binding limit.</text><text x="342" y="246" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">Raising it 8 → 32 bought +87%</text><text x="342" y="263" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">peak throughput and 0% SLO gain.</text><rect x="612" y="84" width="272" height="216" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="612" y="84" width="4" height="216" rx="2" fill="#6e7681"/><text x="634" y="128" fill="#6e7681" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="34" font-weight="700" text-anchor="start">2.13x</text><text x="634" y="150" fill="#e6edf3" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start">vLLM's "maximum concurrency"</text><text x="634" y="178" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">Not a limit at all.</text><text x="634" y="195" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">How many FULL-WINDOW sequences</text><text x="634" y="212" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">the 69,760-token pool holds.</text><text x="634" y="246" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">Blocks are allocated 16 at a time,</text><text x="634" y="263" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.3" font-weight="400" text-anchor="start">so ~95 real chat sequences fit.</text></svg>