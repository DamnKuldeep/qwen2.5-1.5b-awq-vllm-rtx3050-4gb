ple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" text-anchor="start">vLLM  ·  Qwen2.5-1.5B-Instruct-AWQ</text><text x="48" y="283" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">continuous batching  ·  paged KV, 16-token blocks  ·  prefix cache</text><text x="48" y="306" fill="#1f2328" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start">at most 10 requests decoding at once</text><text x="270" y="306" fill="#8c959f" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">— the gateway's limit, not the engine's</text><text x="560" y="262" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">KV pool  69,760 tokens</text><rect x="560" y="272" width="300" height="14" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="560" y="272" width="51.00000000000001" height="14" rx="7" fill="#1a7f37"/><text x="560" y="302" fill="#1a7f37" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" text-anchor="start">peak measured: 17%</text><text x="680" y="302" fill="#8c959f" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">0 preemptions</text><line x1="450.0" y1="208" x2="450.0" y2="230" stroke="#59636e" stroke-width="1.8" marker-end="url(#ah)"/><text x="460.0" y="228" fill="#1a7f37" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" text-anchor="start">admitted</text><rect x="28" y="372" width="844" height="58" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="48" y="396" fill="#1f2328" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start">streamed back token by token</text><text x="48" y="415" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">slot held for the WHOLE stream · usage recorded in a finally block, so a disconnect still bills</text><line x1="450.0" y1="336" x2="450.0" y2="366" stroke="#59636e" stroke-width="1.8" marker-end="url(#ah)"/></svg>